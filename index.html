<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0aabce">
    <meta name="description" content="Relógio analógico vetorial, com fundo turquesa e ponteiros prateados. A hora local em movimento contínuo.">
    <title>Relógio Turquesa</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="clock.js"></script>
  </head>
  <body>
    <main class="clock-stage" aria-label="Relógio Turquesa">
      <svg id="clock" class="clock" viewBox="0 0 1000 1000" aria-hidden="true" focusable="false"></svg>
      <time id="clock-time" class="visually-hidden" role="timer" aria-live="off">Carregando horário local.</time>
      <noscript><p class="no-script">Ative o JavaScript para exibir o relógio com o horário local.</p></noscript>
    </main>
  </body>
</html>
